
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tes Telegram Webhook</title>
  <style>
    body {
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
      padding: 24px;
    }
    button {
      background: #00d6a0;
      color: #10131c;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      width: 100%;
      font-weight: bold;
      font-size: 16px;
    }
    pre {
      background: #202638;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>Telegram Webhook Test</h2>
  <p>Domain: quick-peach-pjst192a.edgeone.dev</p>

  <button id="test">TES WEBHOOK SETUP</button>

  <h3>Hasil pemeriksaan:</h3>
  <pre id="result">Belum dites.</pre>

  <script>
    document.getElementById('test').onclick = async function () {
      const output = document.getElementById('result');
      output.textContent = 'Mengirim POST...';

      try {
        const response = await fetch(
          '/api/telegram-webhook-setup',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({})
          }
        );

        const result = await response.text();

        output.textContent =
          'HTTP STATUS: ' + response.status +
          '\n\nHASIL:\n' + result;
      } catch (error) {
        output.textContent = 'ERROR: ' + error.message;
      }
    };
  </script>
</body>
</html>
