
name: Build Agen Suatu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager tidak ditemukan"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Sign APK
        run: |
          APK=$(find . -maxdepth 1 -iname '*unsigned*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "File unsigned APK tidak ditemukan"
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore agen-suatu.keystore \
            -alias agensuatu \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass AgenSuatu2026 \
            -keypass AgenSuatu2026 \
            -dname "CN=Agen Suatu"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks agen-suatu.keystore \
            --ks-key-alias agensuatu \
            --ks-pass pass:AgenSuatu2026 \
            --key-pass pass:AgenSuatu2026 \
            --out Agen-Suatu.apk "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: Agen-Suatu-APK
          path: Agen-Suatu.apk
