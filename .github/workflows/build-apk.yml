
name: Build Agen Suatu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager tidak ditemukan"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Restore Permanent Keystore
        env:
          KEY_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "KEYSTORE_BASE64 belum diatur"
            exit 1
          fi
          echo "$KEY_B64" | base64 -d > agen-suatu-release.jks

      - name: Sign APK
        env:
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APK=$(find . -maxdepth 1 -iname '*unsigned*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "File unsigned APK tidak ditemukan"
            exit 1
          fi

          if [ -z "$KEY_PASS" ]; then
            echo "KEYSTORE_PASSWORD belum diatur"
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks agen-suatu-release.jks \
            --ks-key-alias agensuatu \
            --ks-pass "pass:$KEY_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out Agen-Suatu.apk "$APK"

      - name: Get SHA256 Certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs Agen-Suatu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Agen-Suatu-APK
          path: Agen-Suatu.apk
